[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "serverwamp"
version = "1.2.0"
description = "Components that add Web Application Messaging Protocol features to WebSocket servers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Justin Turner Arthur", email = "justinarthur@gmail.com" },
]
keywords = [
    "WAMP", "WebSockets", "aiohttp", "RPC", "pubsub", "broker", "dealer",
    "ASGI",
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
    "Framework :: AsyncIO",
    "Framework :: Trio",
]
dependencies = [
    "msgpack>=1.0.0,<2",
]

[project.optional-dependencies]
anyio = [
    "anyio>=4.0",
]
trio = [
    "trio>=0.25.0",
]
docs = [
    "Sphinx>=5.3,<10",
]

[project.urls]
Homepage = "https://github.com/JustinTArthur/serverwamp"
Documentation = "https://serverwamp.readthedocs.io/"

[dependency-groups]
ci = [
    "aiohttp>=3.0.0",
    "anyio>=4.0",
    "msgpack-types>=0.8.0",
    "mypy>=0.770",
    "pytest>=8.0",
    "ruff>=0.17.1,<0.18",
    "trio>=0.25.0",
]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
# Ruff's default rules, as of 0.17, are far broader than these.
select = ["E4", "E7", "E9", "F", "E501", "I", "Q", "UP"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
# Helper modules the tests import from their own directory.
known-local-folder = ["memory_connection", "stream_connection"]

[tool.hatch.build.targets.sdist]
include = [
    "/serverwamp",
    "/CHANGELOG.md",
    "/LICENSE.md",
    "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["serverwamp"]
